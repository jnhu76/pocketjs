[package]
name = "pocket-desktop-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PocketJS portable Rust renderer and worker-owned desktop runtime"

[dependencies]
pocketjs-core = { path = "../../engine/core", features = ["std"] }
pocket-mod = { path = "../../engine/crates/pocket-mod" }
pocket-ui-surface = { path = "../../engine/crates/pocket-ui-surface" }
pocket-text = { path = "../../engine/crates/pocket-text" }
pocket-ui-wgpu = { path = "../../engine/crates/pocket-ui-wgpu" }
pocket3d = { path = "../../engine/pocket3d/crates/pocket3d", default-features = false }
wgpu = "25"
winit = "0.30"
arboard = { version = "3", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
# Bounded WIC decoder integration for the A3 proof harness (imaging +
# COM init/variant plumbing only; no broader Win32 surface). A6 adds the
# HiDpi feature: PMv2 awareness declaration + verification only.
windows = { version = "0.62", features = [
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
] }
# A6: names the raw-window-handle version already in the wgpu/winit tree;
# used only to read the window HWND for the PMv2 awareness assertion.
raw-window-handle = "0.6"

[profile.release]
debug = false
